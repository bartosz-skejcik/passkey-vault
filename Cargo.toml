[workspace]
resolver = "2"
members = ["crates/pv-core", "crates/pv-server", "crates/pv-wasm", "crates/pv-provider", "crates/pv-ffi", "crates/rp-fixture"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = ""
# Internal application crates, never published to crates.io. Required for
# deny.toml's [bans] allow-wildcard-paths to treat this workspace's
# internal path deps (e.g. pv-server -> pv-core) as intended, rather than
# rejecting them as crates.io-incompatible "public" wildcard deps
# (SEC-03, Plan 19-03, Task 3).
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
