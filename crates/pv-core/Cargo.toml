[package]
name = "pv-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared crypto core: key hierarchy, PRF unlock, item encryption. WASM-compatible."

[dependencies]
argon2 = "=0.5.3"
chacha20poly1305 = "=0.10.1"
crypto_box = { version = "=0.9.1", default-features = false, features = ["chacha20", "alloc", "rand_core"] }
hkdf = "=0.12.4"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
serde.workspace = true
thiserror.workspace = true
base64 = "0.22"
totp-rs = { version = "5.7.2", default-features = false, features = ["otpauth"] }

[dev-dependencies]
serde_json.workspace = true
