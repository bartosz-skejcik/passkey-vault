[package]
name = "pv-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-hostable vault server: axum + SQLx/SQLite + webauthn-rs."

[dependencies]
pv-core = { path = "../pv-core" }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "migrate"] }
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.10"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
reqwest = "0.13.4"
