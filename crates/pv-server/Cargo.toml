[package]
name = "pv-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Self-hostable vault server: axum + SQLx/SQLite + webauthn-rs."

[dependencies]
pv-core = { path = "../pv-core" }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "migrate"] }
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.10"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[features]
# Phase 25 (KEY-07): gate-only, empty feature — its sole purpose is to make
# `families::FAULT_INJECT_AFTER_COLLECTION_INDEX` (a `#[cfg(feature =
# "test-support")]`-gated pub thread_local) compile into the dev-dependency
# graph `cargo test` builds (which every `tests/*.rs` integration-test crate
# and this crate's own lib unit tests are part of, via the self-referential
# `[dev-dependencies]` entry below) while staying genuinely absent from a
# production `cargo build`/`cargo build --release`, which pulls in no
# dev-dependencies at all. Deliberately NOT `#[cfg(test)]` — items gated that
# way are invisible to a SEPARATE integration-test crate (`tests/*.rs` is
# compiled as its own crate that merely links against this crate's lib
# target, so `cfg(test)` — only active when THIS crate itself is compiled as
# the thing under test — never activates for it).
test-support = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
reqwest = "0.13.4"
# Self-referential dev-dependency (the standard Cargo idiom for exposing a
# feature-gated item to a crate's own integration tests): enables
# `test-support` ONLY for `cargo test`'s dev-dependency graph, never for a
# production `cargo build` binary. See the `[features]` doc comment above.
pv-server = { path = ".", features = ["test-support"] }
