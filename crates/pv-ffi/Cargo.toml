[package]
name = "pv-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UniFFI bindings for pv-core — thin FFI layer, no crypto logic of its own, mirrors crates/pv-wasm."

[lib]
crate-type = ["staticlib", "lib"]

# ffi06-probe (35-05): gates crates/pv-ffi/src/panic_probe.rs, a single,
# clearly-labeled SYNTHETIC panic vector that exists solely to prove
# FFI-06/CP-3 (UniFFI's catch_unwind scaffolding genuinely intercepts a Rust
# panic crossing the pv-ffi boundary). No genuine, attacker-reachable panic
# exists in pv-core's/pv-provider's production code today (confirmed by grep,
# see panic_probe.rs's own module doc) -- this is a deliberate substitution,
# not a claim about a real vector (P3).
#
# FLIPPED to `default = []` in Phase 36, Plan 36-01: this crate now has a
# genuine NON-TEST consumer, PasskeyVaultAutoFill.appex (the credential-
# provider extension target Task 1 adds) -- the exact "likely Phase 38"
# trigger the DEBT note below named, arriving two phases early. The
# default-on rationale ("this phase builds exactly one consumer,
# PasskeyVaultTests -- no app target yet") no longer holds: a function
# whose sole purpose is to panic must not be compiled by default into the
# process that will handle credentials.
#
# UPDATE (Phase 37, Plan 37-02, Task 1) -- the Run Script phase that passes
# `--with-panic-probe` moved from `PasskeyVaultTests` to the `PasskeyVault`
# APP target itself (a hosted test bundle and its host app cannot both
# compile the generated bindings into their own module), so it is now the
# APP target's own build that inherits that flag's default. Cargo's own
# `default = []` still holds -- nothing links `ffi06-probe` unless a build
# invocation explicitly asks for it -- but `scripts/build-ios.sh`'s Run
# Script phase invocation still asks for it by DEFAULT
# (`${PV_FFI_TEST_VARIANT:---with-panic-probe}`), and that phase is now
# `PasskeyVault`'s own. HONEST RESIDUAL, not claimed closed: there is still
# exactly ONE XCFramework/Run Script phase, now consumed by both the app
# target and the test bundle, so `ffi06_synthetic_panic_probe` ships inside
# every `PasskeyVault.app` this project's current build recipe produces,
# not only test builds. `PasskeyVaultAutoFill.appex` links the same shared
# artifact but has no Run Script phase of its own, so it only avoids the
# probe when the app-owned phase last ran WITHOUT `--with-panic-probe`
# (`scripts/ios-probe-run.sh`'s own call-order discipline, documented in
# `scripts/build-ios.sh`'s header). **Phase 41 (per-target production/test
# build split) is the named owner of closing this for real** -- a genuine
# per-target build product/output path, not a shared one whichever
# invocation ran last wins.
#
# CONFIRMED (Phase 40, Plan 40-04, Task 3) -- this plan's own trigger
# condition ("the moment a second build path exists") had ALREADY arrived
# by Phase 36 (`PasskeyVaultAutoFill.appex`) and the `default = []` flip
# above already happened then, not in this plan. What 40-04 adds is not a
# new flip but a re-verification that the guard still holds against the
# surface Phase 40 just built: `cargo build -p pv-ffi` (no features) is
# zero-warning, `xcodebuild test -only-testing:FfiPanicSafetyTests` still
# passes, and the flag's placement was proven load-bearing by temporarily
# no-op'ing `--with-panic-probe` in `scripts/build-ios.sh` (the test then
# fails to build: "Value of type 'FfiUserKey' has no member
# 'ffi06SyntheticPanicProbe'"), then restoring it (green again;
# 40-04-SUMMARY.md has the transcript). Separately, `project.pbxproj`'s own
# Run Script phase (Phase 39, Plan 39-07, out of this plan's file scope) has
# ALSO since moved off the unconditional `--with-panic-probe` default the
# paragraph above still describes: it now scopes the probe to `Debug`
# config only (`PV_FFI_TEST_VARIANT` still wins when set; Release gets a
# plain artifact). The HONEST RESIDUAL narrows accordingly -- the probe now
# ships in every Debug `PasskeyVault.app`, not every configuration -- but
# does not close: Phase 41's per-target split is still the named owner of
# closing it for real.

# kdf-probe (36-03, E5.c): gates crates/pv-ffi/src/kdf_probe.rs, a single
# diagnostic-only constructor that skips validate_kdf_params's upper bound
# for one fixed, author-chosen 256 MiB value the FILL-06 sensitivity
# control needs and the production constructor correctly rejects. Never
# called by production Swift code; the only Swift caller
# (KdfProbe.swift) is itself gated behind #if PV_PROBE_SENSITIVITY, which
# only scripts/ios-probe-run.sh sensitivity ever compiles. Default-off,
# same posture as ffi06-probe's *current* off-by-default rationale (this
# crate now has non-test consumers -- see that feature's own comment).
[features]
default = []
ffi06-probe = []
kdf-probe = []

# Open Question 1 (35-RESEARCH.md) resolved empirically this session: UniFFI
# 0.32.0's proc-macro mode needs NO build.rs / no [build-dependencies] here
# at all. Instead crates/pv-ffi/src/lib.rs calls `uniffi::setup_scaffolding!()`
# at the crate root -- confirmed against mozilla/uniffi-rs
# docs/manual/src/tutorial/Rust_scaffolding.md via Context7 ("If you are
# only using proc macros and not UDL files, you can skip the build.rs file
# entirely"). `.udl`/traditional mode is the only mode that needs a build.rs.
[dependencies]
pv-core = { path = "../pv-core" }
uniffi = { version = "=0.32.0", features = ["cli"] }
serde_json.workspace = true
zeroize = { version = "1", features = ["derive"] }
thiserror.workspace = true
# Not a new dependency at the workspace level (T-37-12) -- pv-core and
# pv-server already pin `base64 = "0.22"` and it is already resolved in
# Cargo.lock. `derive_auth_material` (37-02) needs `auth_hash_b64` encoded
# with the STANDARD (padded) alphabet, the same one pv-server's
# `routes/auth.rs` decodes with -- BASE64_URL_SAFE_NO_PAD is used elsewhere
# in this workspace (invite links, credential ids) but would silently
# mismatch the server's own `STANDARD.decode(&req.auth_hash)` call.
base64 = "0.22"
