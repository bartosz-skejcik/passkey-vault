<!doctype html>
<!--
  Plan 09-06 REPLACES Phase 8's vanilla debug harness (08-03-PLAN.md)
  entirely with the real popup: React + DaisyUI + Tailwind v4, reusing
  web/'s exact vault-dark/vault-light theme. Fixed 360-400px viewport per
  09-UI-SPEC.md's Popup shell section.

  D-12/plan 11-07: `data-theme` is deliberately NOT hardcoded here anymore
  -- main.tsx resolves it (mirror -> prefers-color-scheme -> vault-dark,
  lib/theme/theme-mirror.ts's resolveTheme()) and stamps <body> BEFORE the
  first ReactDOM render, then keeps it live via watchMirroredTheme(). A
  hardcoded default here would fight that resolution on every popup open.

  11-09 live-review addendum (Bartek 2026-07-16, missed in the first pass):
  `body` now carries a FIXED height (600px -- Chrome's popup ceiling) and
  `overflow: hidden` alongside the existing width, so the outer document
  itself can never scroll -- the popup's OWN nested-scroll bug (header,
  search box, and the auto-lock footer all scrolling away with the page,
  stacked on top of ItemListView's own "Wszystkie" list scroll) was this
  missing constraint, not the inner list's overflow-y:auto (which was
  already correct). Every view's root now sizes itself against this fixed
  height via `#root { height: 100% }` (style.css) + `h-full`/`flex-1` in
  the component tree, so there is exactly ONE scrollable region per view,
  never two.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passkey Vault</title>
  </head>
  <body style="width: 380px; height: 600px; overflow: hidden">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
