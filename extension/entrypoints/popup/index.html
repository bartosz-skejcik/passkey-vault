<!doctype html>
<!--
  Plan 09-06 REPLACES Phase 8's vanilla debug harness (08-03-PLAN.md)
  entirely with the real popup: React + DaisyUI + Tailwind v4, reusing
  web/'s exact vault-dark/vault-light theme. Fixed 360-400px viewport per
  09-UI-SPEC.md's Popup shell section.

  D-12/plan 11-07: `data-theme` is deliberately NOT hardcoded here anymore
  -- main.tsx resolves it (mirror -> prefers-color-scheme -> vault-dark,
  lib/theme/theme-mirror.ts's resolveTheme()) and stamps <body> BEFORE the
  first ReactDOM render, then keeps it live via watchMirroredTheme(). A
  hardcoded default here would fight that resolution on every popup open.

  11-09 live-review addendum (Bartek 2026-07-16, missed in the first pass,
  CORRECTED after a regression report): `body` keeps `overflow: hidden`
  so the outer document itself can never scroll, but does NOT carry a
  fixed height anymore -- an earlier version of this fix pinned `body` to
  600px globally, which forced EVERY view (unlock/server-config/loading/
  detail, not just the item list) to always render at a fixed 600px,
  leaving a large empty gap under short views like UnlockView. Chrome's
  own popup auto-sizing (shrink-to-fit content, up to its own ~600px
  ceiling) is exactly what those short views need and previously had.
  Only the item-LIST view actually needs a hard-pinned 600px shell (its
  single-scroll-region layout, see ItemListView.tsx/App.tsx) -- that
  height now lives locally on that view's own wrapper (`h-[600px]` in
  App.tsx's list branch), not globally on `body`.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passkey Vault</title>
  </head>
  <body style="width: 380px; overflow: hidden">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
