<!--
  Source: modeled on a typical shipping-address form step (first/last name,
  email, phone, single-line street address, standardized autocomplete
  tokens). Sanitized, no live PII, no scripts, no external asset
  references.
  Captured: 2026-07-15
-->
<form id="shipping-form" autocomplete="on">
  <label for="fname">First name</label>
  <input id="fname" name="first_name" type="text" autocomplete="given-name" />

  <label for="lname">Last name</label>
  <input id="lname" name="last_name" type="text" autocomplete="family-name" />

  <label for="em">Email</label>
  <input id="em" name="email_address" type="email" autocomplete="email" />

  <label for="ph">Phone</label>
  <input id="ph" name="phone_number" type="tel" autocomplete="tel" />

  <label for="addr">Street address</label>
  <input id="addr" name="street1" type="text" autocomplete="street-address" />
</form>
