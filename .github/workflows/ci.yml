name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
        with:
          target: wasm32-unknown-unknown
      - name: cargo test --workspace
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
        with:
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            packages/pv-ui/package-lock.json
      - name: Build pv-wasm
        run: bash scripts/build-wasm.sh
      - name: Install pv-ui deps
        run: npm ci
        working-directory: packages/pv-ui
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Typecheck (tsc --noEmit)
        run: npm run compile
        working-directory: web
      - name: Test (vitest)
        run: npm test
        working-directory: web
      - name: Build (next build)
        run: npm run build
        working-directory: web

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
        with:
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            packages/pv-ui/package-lock.json
      - name: Build pv-wasm
        run: bash scripts/build-wasm.sh
      - name: Install pv-ui deps
        run: npm ci
        working-directory: packages/pv-ui
      - name: Install extension deps
        run: npm ci
        working-directory: extension
      - name: Typecheck (tsc --noEmit)
        run: npm run compile
        working-directory: extension
      - name: Test (vitest)
        run: npm test
        working-directory: extension
      - name: Build (Chrome)
        run: npm run build:chrome
        working-directory: extension
      - name: Build (Firefox)
        run: npm run build:firefox
        working-directory: extension
      - name: Lint (web-ext, Firefox build)
        run: npm run lint:firefox
        working-directory: extension
      - name: MAIN-world boundary audit
        run: bash scripts/audit-mainworld-boundary.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
        with:
          target: wasm32-unknown-unknown
      - name: Install cargo-audit
        run: cargo install --version 0.22.2 cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install --version 0.20.2 cargo-deny --locked
      - name: Supply-chain check (cargo audit + cargo deny)
        run: bash scripts/check-supply-chain.sh
