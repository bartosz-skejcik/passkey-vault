# .cargo/audit.toml — cargo-audit's own ignore-list config (Plan 19-03,
# Task 3). Distinct from deny.toml: `cargo-audit` and `cargo-deny` are
# separate tools with separate advisory-ignore mechanisms; deny.toml's
# [advisories] ignore list only affects `cargo deny check`. This file
# mirrors that same justification for `cargo audit`'s own scan so the
# combined scripts/check-supply-chain.sh tripwire reaches a clean pass
# instead of silently swallowing the finding in only one of the two tools.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa 0.9.10, "Marvin Attack" timing sidechannel, no
    # fixed upgrade available upstream): transitive-only via sqlx-mysql,
    # which is present in Cargo.lock's full resolve graph but NOT actually
    # compiled by this workspace -- pv-server's Cargo.toml enables only
    # sqlx's "sqlite" feature (never "mysql"), empirically confirmed via a
    # clean `cargo build --workspace` producing no sqlx-mysql/rsa build
    # artifacts under target/debug. This project is SQLite-only per
    # CLAUDE.md's Docker single-container constraint (no required external
    # services, no MySQL) -- rsa's timing sidechannel is not reachable from
    # any code path this deployment executes. Re-verify this entry if
    # pv-server ever enables sqlx's "mysql" feature. See deny.toml's
    # matching [advisories] ignore entry for the cargo-deny side of this
    # same justification.
    "RUSTSEC-2023-0071",
]
